<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechOps Insight</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f5f7fb; color: #102a43; }
      .app { max-width: 980px; margin: 0 auto; padding: 24px; }
      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
      header h1 { margin: 0; font-size: 1.8rem; }
      button { padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
      button:disabled { background: #94a3b8; cursor: not-allowed; }
      .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
      .card { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08); }
      label { display: block; margin-bottom: 8px; font-weight: 600; }
      input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 14px; }
      textarea { width: 100%; min-height: 120px; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px; }
      .hidden { display: none; }
      .error { color: #b91c1c; font-size: 0.95rem; margin-top: 8px; }
      .table { width: 100%; border-collapse: collapse; }
      .table th, .table td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
      .table th { color: #475569; font-weight: 700; }
      .status-pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; }
      .status-success { background: #dcfce7; color: #166534; }
      .status-pending { background: #fef3c7; color: #92400e; }
      .status-failed { background: #fee2e2; color: #991b1b; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <h1>TechOps Insight</h1>
          <p>Customer + payments dashboard</p>
        </div>
        <button id="logoutBtn" class="hidden">Logout</button>
      </header>

      <div id="authSection" class="grid">
        <div class="card">
          <h2>Login</h2>
          <label>Email</label>
          <input type="email" id="loginEmail" />
          <label>Password</label>
          <input type="password" id="loginPassword" />
          <button id="loginBtn">Login</button>
          <p class="error" id="loginError"></p>
        </div>
        <div class="card">
          <h2>Register</h2>
          <label>Username</label>
          <input type="text" id="registerUsername" />
          <label>Email</label>
          <input type="email" id="registerEmail" />
          <label>Password</label>
          <input type="password" id="registerPassword" />
          <button id="registerBtn">Register</button>
          <p class="error" id="registerError"></p>
        </div>
      </div>

      <div id="mainSection" class="hidden">
        <div class="grid">
          <div class="card">
            <h2>Customer actions</h2>
            <label>Company name</label>
            <input type="text" id="customerName" />
            <label>Contact email</label>
            <input type="email" id="customerEmail" />
            <button id="createCustomerBtn">Create customer</button>
            <p class="error" id="customerError"></p>
          </div>
          <div class="card">
            <h2>Payment</h2>
            <label>Customer ID</label>
            <input type="number" id="paymentCustomerId" />
            <label>Phone</label>
            <input type="text" id="paymentPhone" />
            <label>Amount</label>
            <input type="number" step="0.01" id="paymentAmount" />
            <button id="payBtn">Send STK Push</button>
            <p class="error" id="paymentError"></p>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <h2>Customers</h2>
            <table class="table" id="customersTable">
              <thead>
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Status</th><th>Subscription</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="card">
            <h2>Analytics</h2>
            <div id="analyticsSummary"></div>
          </div>
        </div>

        <div class="card">
          <h2>Transactions</h2>
          <table class="table" id="transactionsTable">
            <thead>
              <tr><th>ID</th><th>Customer</th><th>Amount</th><th>Phone</th><th>Status</th><th>Receipt</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const apiBase = window.location.origin.replace('/frontend', '');
      let token = localStorage.getItem('techops_token');

      const authSection = document.getElementById('authSection');
      const mainSection = document.getElementById('mainSection');
      const logoutBtn = document.getElementById('logoutBtn');

      const setError = (id, message) => document.getElementById(id).textContent = message;

      const authHeaders = () => ({
        'Content-Type': 'application/json',
        Authorization: token ? `Bearer ${token}` : ''
      });

      const toggleSections = () => {
        const loggedIn = Boolean(token);
        authSection.classList.toggle('hidden', loggedIn);
        mainSection.classList.toggle('hidden', !loggedIn);
        logoutBtn.classList.toggle('hidden', !loggedIn);
      };

      const fetchJson = async (path, options = {}) => {
        const res = await fetch(`${apiBase}${path}`, options);
        return { ok: res.ok, status: res.status, data: await res.json() };
      };

      const login = async () => {
        setError('loginError', '');
        const response = await fetchJson('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value
          })
        });
        if (!response.ok) return setError('loginError', response.data.error || 'Login failed');
        token = response.data.access_token;
        localStorage.setItem('techops_token', token);
        await loadApp();
      };

      const register = async () => {
        setError('registerError', '');
        const response = await fetchJson('/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('registerUsername').value,
            email: document.getElementById('registerEmail').value,
            password: document.getElementById('registerPassword').value
          })
        });
        if (!response.ok) return setError('registerError', response.data.error || 'Register failed');
        await login();
      };

      const loadCustomers = async () => {
        const response = await fetchJson('/customers', { headers: authHeaders() });
        if (!response.ok) return;
        const tbody = document.querySelector('#customersTable tbody');
        tbody.innerHTML = response.data.map(customer => `
          <tr>
            <td>${customer.id}</td>
            <td>${customer.company_name}</td>
            <td>${customer.contact_email}</td>
            <td>${customer.status}</td>
            <td>${customer.subscription_status}</td>
          </tr>
        `).join('');
      };

      const loadTransactions = async () => {
        const response = await fetchJson('/payments/transactions', { headers: authHeaders() });
        if (!response.ok) return;
        const tbody = document.querySelector('#transactionsTable tbody');
        tbody.innerHTML = response.data.map(tx => `
          <tr>
            <td>${tx.id}</td>
            <td>${tx.customer_id}</td>
            <td>${tx.amount}</td>
            <td>${tx.phone_number}</td>
            <td><span class="status-pill status-${tx.status}">${tx.status}</span></td>
            <td>${tx.mpesa_receipt || '—'}</td>
          </tr>
        `).join('');
      };

      const loadAnalytics = async () => {
        const response = await fetchJson('/analytics/summary', { headers: authHeaders() });
        if (!response.ok) return;
        const summary = response.data;
        document.getElementById('analyticsSummary').innerHTML = `
          <p><strong>Total customers:</strong> ${summary.total_customers}</p>
          <p><strong>Active customers:</strong> ${summary.active_customers}</p>
          <p><strong>Subscription active:</strong> ${summary.subscription_active}</p>
          <p><strong>Successful payments:</strong> ${summary.successful_transactions}</p>
          <p><strong>Pending payments:</strong> ${summary.pending_transactions}</p>
          <p><strong>Successful amount:</strong> ${summary.successful_amount}</p>
        `;
      };

      const createCustomer = async () => {
        setError('customerError', '');
        const response = await fetchJson('/customers', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({
            company_name: document.getElementById('customerName').value,
            contact_email: document.getElementById('customerEmail').value
          })
        });
        if (!response.ok) return setError('customerError', response.data.error || 'Failed to create customer');
        await loadCustomers();
      };

      const sendPayment = async () => {
        setError('paymentError', '');
        const response = await fetchJson('/payments/stk-push', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({
            customer_id: Number(document.getElementById('paymentCustomerId').value),
            phone: document.getElementById('paymentPhone').value,
            amount: Number(document.getElementById('paymentAmount').value)
          })
        });
        if (!response.ok) return setError('paymentError', response.data.error || 'Payment failed');
        await loadTransactions();
      };

      const logout = () => {
        token = null;
        localStorage.removeItem('techops_token');
        toggleSections();
      };

      const loadApp = async () => {
        toggleSections();
        if (!token) return;
        await Promise.all([loadCustomers(), loadTransactions(), loadAnalytics()]);
      };

      document.getElementById('loginBtn').addEventListener('click', login);
      document.getElementById('registerBtn').addEventListener('click', register);
      document.getElementById('createCustomerBtn').addEventListener('click', createCustomer);
      document.getElementById('payBtn').addEventListener('click', sendPayment);
      logoutBtn.addEventListener('click', logout);

      loadApp();
    </script>
  </body>
</html>
